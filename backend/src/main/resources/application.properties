spring.application.name=ForenSight AI Backend
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/forensight_db}
spring.mongodb.database=${MONGODB_DATABASE:forensight_db}
forensight.trufor.enabled=${TRUFOR_ENABLED:false}
forensight.trufor.python=${TRUFOR_PYTHON:python3}
forensight.trufor.bridge=${TRUFOR_BRIDGE:}
forensight.upload.max-bytes=4194304
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=4.4MB
server.port=${PORT:8080}
