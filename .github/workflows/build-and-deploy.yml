name: ForenSight Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "Dockerfile"
      - "README.md"
      - ".github/workflows/build-and-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: forensight-ci
  cancel-in-progress: false

jobs:
  build-frontend:
    timeout-minutes: 20
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend packages
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        env:
          GITHUB_PAGES: "true"
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://forensight-api-o5qp.onrender.com' }}
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  build-backend:
    timeout-minutes: 30
    name: Compile backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Test and package Spring Boot backend
        working-directory: backend
        env:
          APP_USERNAME: ci-investigator
          APP_PASSWORD: ci-only-not-a-production-secret
          MONGODB_URI: mongodb://localhost:27017/forensight_ci
          MONGODB_DATABASE: forensight_ci
        run: bash ./mvnw -B verify

  deploy-pages:
    name: Deploy frontend to GitHub Pages
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4


  smoke-test-live:
    name: Smoke test deployed frontend and API
    needs: [deploy-pages]
    runs-on: ubuntu-latest
    steps:
      - name: Verify public frontend
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-connrefused \
            https://sindhujakamban.github.io/Forensight-/ -o /tmp/forensight-index.html
          grep -qi "ForenSight" /tmp/forensight-index.html
      - name: Verify backend and MongoDB readiness
        shell: bash
        env:
          BACKEND_URL: ${{ vars.VITE_API_BASE_URL || 'https://forensight-api-o5qp.onrender.com' }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            response="$(curl --silent --show-error --fail --max-time 20 "${BACKEND_URL%/}/api/health" 2>/dev/null || true)"
            if echo "$response" | grep -q '"status"[[:space:]]*:[[:space:]]*"UP"' \
              && echo "$response" | grep -q '"database"[[:space:]]*:[[:space:]]*"UP"'; then
              echo "Backend and MongoDB are healthy at ${BACKEND_URL}."
              exit 0
            fi
            echo "Backend not ready yet (attempt $attempt/18)."
            sleep 10
          done
          echo "::error::Backend or MongoDB is not healthy. Configure MONGODB_URI and APP_PASSWORD in the Render service."
          exit 1
