name: ForenSight Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "Dockerfile"
      - "README.md"
      - ".gitignore"
      - ".github/workflows/build-and-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: forensight-ci
  cancel-in-progress: false

jobs:
  build-frontend:
    timeout-minutes: 20
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend packages
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        env:
          GITHUB_PAGES: "true"
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  build-backend:
    timeout-minutes: 30
    name: Compile backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Compile Spring Boot backend
        working-directory: backend
        run: bash ./mvnw -B -DskipTests package

  deploy-pages:
    name: Deploy frontend to GitHub Pages
    if: ${{ vars.DEPLOY_TO_GITHUB_PAGES == 'true' }}
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
