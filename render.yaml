services:
  - type: web
    name: forensight-api
    runtime: docker
    plan: standard
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    disk:
      name: forensight-uploads
      mountPath: /app/uploads
      sizeGB: 5
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: forensight_db
      - key: APP_USERNAME
        value: investigator
      - key: APP_PASSWORD
        sync: false
      - key: TRUFOR_ENABLED
        value: "true"
      - key: TRUFOR_ROOT
        value: /opt/trufor
      - key: TRUFOR_PYTHON
        value: python
      - key: TRUFOR_BRIDGE
        value: /app/backend/trufor/trufor_bridge.py
      - key: TRUFOR_OUTPUT_DIR
        value: /app/uploads/trufor
