services:
  - type: web
    name: forensight-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: forensight_db
      - key: APP_USERNAME
        value: investigator
      - key: APP_PASSWORD
        sync: false
      - key: TRUFOR_ENABLED
        value: "false"
